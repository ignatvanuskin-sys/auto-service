name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
  cron:
    # Напоминания каждые 15 минут — только при настроенных секретах окружения
    if: vars.PROD_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$PROD_URL/api/cron/reminders"
